# Builds tme on every push and pull request. On Linux, configure picks
# the displays from the libraries installed (the VNC display, rfb, needs
# none), so each job installs only those for its displays and checks
# that configure chose them and that tmesh can load them. macOS builds
# with the SDL display, and Windows (with MSYS2) builds the zip and tries
# it. The packages
# job builds the .deb and builds again from the make dist tarball, as
# the release workflow does.
name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - displays: rfb sdl
            packages: libsdl2-dev
          - displays: rfb
            packages: ""
    name: linux (${{ matrix.displays }})
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libltdl-dev pkg-config bison texinfo zlib1g-dev ${{ matrix.packages }}
      - name: Build
        run: |
          autoreconf -fi
          ./configure
          make -j"$(nproc)"
      - name: Check the displays
        run: .github/check-displays.sh ${{ matrix.displays }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: brew install autoconf automake libtool pkgconf texinfo sdl2
      - name: Build
        run: |
          autoreconf -fi
          ./configure --enable-hosts="rfb sdl tun bsd udp"
          make -j"$(sysctl -n hw.ncpu)"
      - name: Check the displays
        run: .github/check-displays.sh rfb sdl

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # configure and the build's shell scripts need LF line endings:
      - name: Keep line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            autoconf
            automake
            bison
            curl
            git
            libtool
            make
            texinfo
            unzip
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-zlib
      # the zip's build checks that tmesh.exe runs, and loads its
      # displays:
      - name: Build
        run: VERSION=0.0.0 packaging/build-win.sh
      - name: Test
        run: |
          mkdir test
          unzip -q -d test dist/tme-rp-*.zip
          cd test/tme-rp-*/
          # a Sun-2 without its PROM: the elements load from tmesh.exe,
          # and the machine makes its IDPROM:
          cat > sun2.cfg <<'EOF'
          mainbus0: tme/machine/sun2 multibus idprom.bin
          cpu0 at mainbus0: tme/ic/m68010
          obio0 at mainbus0 obio: tme/generic/bus size 8MB
          obmem0 at mainbus0 obmem: tme/generic/bus size 16MB
          ram0 at obmem0 addr 0x0: tme/host/posix/memory ram 4MB
          zs0 at obio0 addr 0x2000 ipl 6: tme/machine/sun2/zs
          EOF
          out=$(echo 'source sun2.cfg' | ./tmesh.exe --shell 2>&1)
          echo "$out"
          if grep -q 'sun2\.cfg:' <<< "$out"; then
            exit 1
          fi
          test "$(wc -c < idprom.bin)" -eq 32
      - uses: actions/upload-artifact@v7
        with:
          name: tme-windows-x86_64
          path: dist/*.zip

  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libltdl-dev pkg-config bison texinfo libsdl2-dev zlib1g-dev dpkg-dev
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz" |
            sudo tar xzf - -C /usr/local/bin nfpm
      - name: Build the .deb
        run: VERSION=0.0.0 packaging/build-deb.sh
      - name: Build from the make dist tarball
        run: |
          make dist
          mkdir tarball
          tar xzf tme-*.tar.gz -C tarball
          cd tarball/tme-*
          ./configure --enable-hosts="rfb sdl tun bsd udp"
          make -j"$(nproc)"
