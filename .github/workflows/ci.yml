# Builds tme on every push and pull request. On Linux, configure picks
# the displays from the libraries installed (the VNC display, rfb, needs
# none), so each job installs only those for its displays and checks
# that configure chose them and that tmesh can load them. macOS builds
# with the SDL display. The packages
# job builds the .deb and builds again from the make dist tarball, as
# the release workflow does.
name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - displays: rfb sdl
            packages: libsdl2-dev
          - displays: rfb
            packages: ""
    name: linux (${{ matrix.displays }})
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libltdl-dev pkg-config bison texinfo zlib1g-dev ${{ matrix.packages }}
      - name: Build
        run: |
          autoreconf -fi
          ./configure
          make -j"$(nproc)"
      - name: Check the displays
        run: .github/check-displays.sh ${{ matrix.displays }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: brew install autoconf automake libtool pkgconf texinfo sdl2
      - name: Build
        run: |
          autoreconf -fi
          ./configure --enable-hosts="rfb sdl tun bsd udp"
          make -j"$(sysctl -n hw.ncpu)"
      - name: Check the displays
        run: .github/check-displays.sh rfb sdl

  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libltdl-dev pkg-config bison texinfo libsdl2-dev zlib1g-dev dpkg-dev
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz" |
            sudo tar xzf - -C /usr/local/bin nfpm
      - name: Build the .deb
        run: VERSION=0.0.0 packaging/build-deb.sh
      - name: Build from the make dist tarball
        run: |
          make dist
          mkdir tarball
          tar xzf tme-*.tar.gz -C tarball
          cd tarball/tme-*
          ./configure --enable-hosts="rfb sdl tun bsd udp"
          make -j"$(nproc)"
